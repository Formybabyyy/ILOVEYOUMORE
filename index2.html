<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Kruthika ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--blush:#fde4ea;--cream:#fff6ee;--rose:#d9506e;--crimson:#a3122e;--gold:#c98b82;--ink:#6b1a2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;overflow-x:hidden}
section{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.2rem;overflow:hidden}
.locked{display:none}
.fh{position:absolute;bottom:-12%;pointer-events:none;opacity:0;animation:rise linear infinite;color:var(--rose)}
@keyframes rise{0%{transform:translateY(0) rotate(-15deg);opacity:0}12%{opacity:.75}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.sp{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.6) 30%,transparent 70%);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,-25px)}}

/* hero */
#hero{background:radial-gradient(ellipse at 50% 30%,var(--cream) 0,var(--blush) 60%,#f9c9d6 100%);transition:opacity .6s ease,transform .6s ease}
#hero.out{opacity:0;transform:scale(1.04)}
#hero h1{position:relative;z-index:2;margin:0 0 2rem;font-weight:700;font-size:clamp(2.2rem,9vw,5.2rem);line-height:1.15;letter-spacing:.06em;color:var(--crimson);text-shadow:0 0 30px rgba(255,255,255,.9),0 4px 24px rgba(217,80,110,.35);animation:enter 1.6s cubic-bezier(.2,.7,.2,1) both}
#go{position:relative;z-index:2;font:italic 500 clamp(1.2rem,4.5vw,1.6rem)/1 'Cormorant Garamond',Georgia,serif;color:#fff;border:0;border-radius:999px;padding:.9rem 2.4rem;cursor:pointer;background:linear-gradient(135deg,#e8708a,var(--crimson));box-shadow:0 8px 28px rgba(217,80,110,.45),0 0 0 6px rgba(255,255,255,.35);animation:enter 1.6s .5s cubic-bezier(.2,.7,.2,1) both,pulse 2.8s 2s ease-in-out infinite;transition:transform .3s ease,box-shadow .3s ease}
#go:hover,#go:focus-visible{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 36px rgba(217,80,110,.65),0 0 0 8px rgba(255,255,255,.5);outline:none}
@keyframes enter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 8px 34px rgba(217,80,110,.7),0 0 0 10px rgba(255,255,255,.25)}}

/* bouquet */
#stage{background:linear-gradient(180deg,var(--cream),var(--blush));animation:enter 1.2s ease both}
#cv{display:block;width:min(90vw,480px,calc((100vh - 150px)*.857));width:min(90vw,480px,calc((100svh - 150px)*.857));aspect-ratio:600/700;filter:drop-shadow(0 10px 28px rgba(163,18,46,.3)) drop-shadow(0 0 22px rgba(255,150,175,.35))}
.hint{margin-top:.6rem;color:var(--crimson);cursor:pointer;background:none;border:0;font:italic 500 clamp(1.1rem,4vw,1.5rem) 'Cormorant Garamond',Georgia,serif}
.hint svg{display:block;margin:.3rem auto 0;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(10px)}}

/* message */
#msg{background:linear-gradient(180deg,var(--blush),var(--cream) 55%,#fde9ec)}
#msg .heart{font-size:2.6rem;color:var(--rose);animation:beat 1.6s ease-in-out infinite;margin-bottom:1.4rem}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#msg p{max-width:22ch;margin:0;font-size:clamp(1.7rem,6.2vw,3.2rem);line-height:1.45;font-weight:500;font-style:italic;color:var(--crimson)}
.arr{margin-top:2.2rem;background:none;border:0;color:var(--crimson);cursor:pointer;padding:.4rem}
.arr svg{display:block;animation:bounce 1.6s ease-in-out infinite}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* finale */
#fin{background:linear-gradient(160deg,#f8b4c6 0,#f27a9a 45%,#e0527a 100%);color:#fff}
#fin .l{position:relative;z-index:2;margin:.5rem 0;text-shadow:0 0 22px rgba(255,255,255,.7),0 4px 18px rgba(130,10,50,.35);max-width:100%}
.l1{font-size:clamp(1.6rem,6.5vw,3rem);font-weight:500;letter-spacing:.08em}
.l2{font-size:clamp(2rem,11.5vw,7rem);font-weight:700;line-height:1;letter-spacing:.02em;margin:.8rem 0!important;background:linear-gradient(90deg,#fff,#ffe3ea,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,255,255,.6));animation:shine 4s ease-in-out infinite}
@keyframes shine{50%{filter:drop-shadow(0 0 30px rgba(255,255,255,.95))}}
.l3{font-size:clamp(1.2rem,5vw,2.4rem);font-style:italic;letter-spacing:.08em}
.l4{font-size:clamp(1.4rem,6vw,2.6rem);letter-spacing:.1em;animation:beat 2s ease-in-out infinite}
.l5{font-size:clamp(1.4rem,5.8vw,2.6rem);font-style:italic;font-weight:600;letter-spacing:.05em;margin-top:1.2rem!important}
#fin .fh{color:#fff}

@media (prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
.rv{opacity:1;transform:none}.fh{opacity:.5;bottom:auto}
}
</style>
</head>
<body>

<section id="hero">
  <div class="glow" style="width:320px;height:320px;background:#ffb6c8;left:-80px;top:5%"></div>
  <div class="glow" style="width:280px;height:280px;background:#fff;right:-60px;bottom:10%;animation-delay:-4s"></div>
  <h1>I LOVE YOU MORE ♡</h1>
  <button id="go" type="button">Know why?</button>
</section>

<section id="stage" class="locked">
  <canvas id="cv" role="img" aria-label="A bouquet of red roses assembling from binary digits"></canvas>
  <button class="hint" id="more" type="button">There’s a little more...
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M5 13l7 7 7-7"/></svg>
  </button>
</section>

<section id="msg" class="locked">
  <div class="heart rv" aria-hidden="true">♥</div>
  <p class="rv" style="transition-delay:.3s">I love you more, endhuku ante... I made this website and I sent you flowers online 😁</p>
  <button class="arr rv" id="down" type="button" aria-label="Scroll down" style="transition-delay:.9s">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M5 13l7 7 7-7"/></svg>
  </button>
</section>

<section id="fin" class="locked">
  <div class="glow" style="width:360px;height:360px;background:#fff;opacity:.45;left:-100px;top:10%"></div>
  <div class="glow" style="width:300px;height:300px;background:#ffd1a8;opacity:.5;right:-80px;bottom:5%;animation-delay:-5s"></div>
  <div class="l l1 rv">I LOVEE YOU</div>
  <div class="l l2 rv" style="transition-delay:.5s">KRUTHIKAAAA</div>
  <div class="l l3 rv" style="transition-delay:1s">FOREVERR AND EVERR</div>
  <div class="l l4 rv" style="transition-delay:1.5s">😘😘😘😘😘😘</div>
  <div class="l l5 rv" style="transition-delay:2.1s">Nuve na pella epatikii</div>
</section>

<script>
(function(){
var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(i){return document.getElementById(i)};
function rnd(a,b){return a+Math.random()*(b-a)}
function floaters(el,n,cls,chars){
  for(var i=0;i<n;i++){
    var s=document.createElement('span');s.setAttribute('aria-hidden','true');
    if(chars){s.className='fh';s.textContent=chars[i%chars.length];s.style.fontSize=rnd(14,34)+'px';s.style.animationDuration=rnd(9,18)+'s';s.style.animationDelay=(-rnd(0,18))+'s';s.style.left=rnd(2,96)+'%'}
    else{s.className='sp';var z=rnd(6,16);s.style.cssText='width:'+z+'px;height:'+z+'px;left:'+rnd(2,96)+'%;top:'+rnd(2,96)+'%;animation-delay:'+rnd(0,3)+'s;animation-duration:'+rnd(2,4)+'s'}
    el.appendChild(s);
  }
}
floaters($('hero'),16,0,['♡','♥','✿','♡']);
floaters($('hero'),12,0,null);
floaters($('fin'),20,0,['♥','♡','♥','✦']);
floaters($('fin'),22,0,null);

/* ---------- Rose artwork (vector foundation) ---------- */
var W=600,H=700,sc=document.createElement('canvas');sc.width=W;sc.height=H;
function leaf(c,x,y,a,L){
  c.save();c.translate(x,y);c.rotate(a);
  var g=c.createLinearGradient(0,0,L,0);g.addColorStop(0,'#1d5230');g.addColorStop(1,'#3b8f55');
  c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(L*.5,-L*.34,L,0);c.quadraticCurveTo(L*.5,L*.34,0,0);c.fill();
  c.strokeStyle='rgba(10,50,25,.55)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,0);c.lineTo(L*.92,0);c.stroke();c.restore();
}
function petal(c,a,dist,len,w,dk,lt,R){
  c.save();c.rotate(a);c.translate(0,-dist);
  c.shadowColor='rgba(35,0,10,.55)';c.shadowBlur=R*.12;c.shadowOffsetY=R*.02;
  var g=c.createLinearGradient(0,0,0,-len);g.addColorStop(0,dk);g.addColorStop(.62,lt);g.addColorStop(1,'#e2587a');
  c.fillStyle=g;c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(-w,-len*.1,-w*1.2,-len*.82,-w*.38,-len*.99);
  c.quadraticCurveTo(0,-len*1.07,w*.38,-len*.99);
  c.bezierCurveTo(w*1.2,-len*.82,w,-len*.1,0,0);c.fill();
  c.shadowColor='transparent';
  c.strokeStyle='rgba(255,190,200,.5)';c.lineWidth=R*.03;c.lineCap='round';
  c.beginPath();c.moveTo(-w*.95,-len*.55);c.bezierCurveTo(-w*1.05,-len*.84,-w*.45,-len*1.03,0,-len*1.02);c.bezierCurveTo(w*.45,-len*1.03,w*1.05,-len*.84,w*.95,-len*.55);c.stroke();
  c.strokeStyle='rgba(60,0,15,.2)';c.lineWidth=1;
  [-.45,0,.45].forEach(function(f){c.beginPath();c.moveTo(0,-len*.1);c.quadraticCurveTo(w*f*.6,-len*.5,w*f*.8,-len*.85);c.stroke()});
  c.restore();
}
function rose(c,x,y,R,seed){
  c.save();c.translate(x,y);
  c.fillStyle='#55061a';c.beginPath();c.arc(0,0,R*.6,0,7);c.fill();
  [[6,.1,.9,.5,'#74091f','#c01f3f',0],[5,.08,.72,.42,'#690a20','#b51b3c',.5],[4,.06,.55,.34,'#5c081c','#a8173a',.3],[3,.05,.38,.27,'#4f0618','#9a1334',.9]].forEach(function(L,i){
    for(var j=0;j<L[0];j++)petal(c,j*6.2832/L[0]+L[6]+seed,R*L[1],R*L[2],R*L[3],L[4],L[5],R);
  });
  var g=c.createRadialGradient(0,0,0,0,0,R*.2);g.addColorStop(0,'#35030f');g.addColorStop(1,'#861030');
  c.fillStyle=g;c.beginPath();c.arc(0,0,R*.2,0,7);c.fill();
  c.strokeStyle='rgba(255,160,175,.4)';c.lineWidth=R*.025;c.lineCap='round';
  for(var q=0;q<3;q++){c.beginPath();c.arc(0,0,R*(.06+q*.05),seed+q*2,seed+q*2+3.2);c.stroke()}
  var h=c.createRadialGradient(-R*.3,-R*.35,0,-R*.3,-R*.35,R*.7);h.addColorStop(0,'rgba(255,200,210,.28)');h.addColorStop(1,'rgba(255,200,210,0)');
  c.fillStyle=h;c.beginPath();c.arc(0,0,R,0,7);c.fill();
  c.restore();
}
function drawBouquet(){
  var c=sc.getContext('2d');c.clearRect(0,0,W,H);
  c.fillStyle='#f9e4dc';c.beginPath();c.moveTo(300,690);c.lineTo(30,330);c.quadraticCurveTo(300,285,570,330);c.closePath();c.fill();
  var R=[],sr=function(i){var v=Math.sin(i*127.1+11.7)*43758.5453;return v-Math.floor(v)},ri=0;
  for(var yy=96;yy<=356;yy+=52){
    var hw=yy<=300?Math.sqrt(Math.max(0,1-Math.pow((300-yy)/215,2)))*236:236-(yy-300)*.9,row=Math.round((yy-96)/52),st=Math.floor(hw/72)*72;
    for(var xx=300-st+(row%2?36:0);xx<=300+hw;xx+=72){ri++;R.push([xx+(sr(ri)-.5)*10,yy+(sr(ri+99)-.5)*10,42+sr(ri+7)*8])}
  }
  c.lineCap='round';
  R.forEach(function(r){c.strokeStyle='#2c6a3a';c.lineWidth=5;c.beginPath();c.moveTo(r[0],r[1]);c.quadraticCurveTo(r[0],r[1]+160,300,630);c.stroke()});
  [[75,335,-3.0,95],[525,335,0,95],[105,265,-2.7,90],[495,265,-.45,90],[155,200,-2.4,85],[445,200,-.75,85],[235,115,-2.2,80],[365,115,-.95,80],[300,80,-1.57,75],[70,385,-3.1,85],[530,385,0,85],[200,380,-2.6,80],[400,380,-.55,80]].forEach(function(l){leaf(c,l[0],l[1],l[2],l[3])});
  R.forEach(function(r,i){rose(c,r[0],r[1],r[2],i*1.7)});
  var g=c.createLinearGradient(0,400,0,690);g.addColorStop(0,'#f7b5c4');g.addColorStop(1,'#ee8fa6');
  c.fillStyle=g;c.beginPath();c.moveTo(45,395);c.quadraticCurveTo(300,345,555,395);c.lineTo(300,694);c.closePath();c.fill();
  c.fillStyle='#fde9e4';c.strokeStyle='rgba(180,70,100,.4)';c.lineWidth=2;
  c.beginPath();c.moveTo(555,395);c.lineTo(300,694);c.lineTo(440,380);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(45,395);c.lineTo(300,694);c.lineTo(160,378);c.closePath();c.fillStyle='#f9c9d4';c.fill();c.stroke();
  var rg=c.createLinearGradient(0,0,600,0);rg.addColorStop(0,'#c98b82');rg.addColorStop(.5,'#f0c2b4');rg.addColorStop(1,'#c98b82');
  c.fillStyle=rg;c.beginPath();c.moveTo(150,512);c.quadraticCurveTo(300,542,450,512);c.lineTo(424,548);c.quadraticCurveTo(300,578,176,548);c.closePath();c.fill();
  c.save();c.translate(300,548);
  [[-.5,-1],[.5,1]].forEach(function(b){c.save();c.rotate(b[0]);c.beginPath();c.ellipse(b[1]*38,-6,40,19,b[0]*.4,0,7);c.fill();c.strokeStyle='rgba(120,50,50,.35)';c.stroke();c.restore()});
  c.beginPath();c.moveTo(-8,8);c.quadraticCurveTo(-45,50,-60,95);c.lineTo(-36,88);c.lineTo(-4,14);c.fill();
  c.beginPath();c.moveTo(8,8);c.quadraticCurveTo(45,50,60,95);c.lineTo(36,88);c.lineTo(4,14);c.fill();
  c.beginPath();c.arc(0,0,14,0,7);c.fillStyle='#d9a094';c.fill();c.restore();
}

/* ---------- Binary assembly animation ---------- */
var cv=$('cv'),ctx=cv.getContext('2d'),P=[],AM=[],SP=[],k=1,t0=0,on=false,built=false,lastT=99;
function fit(){var d=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||320;cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);k=cv.width/W;if(built&&(RM||!on))draw(lastT)}
function build(){
  drawBouquet();
  var d=sc.getContext('2d').getImageData(0,0,W,H).data,S=9;
  for(var gy=S/2;gy<H;gy+=S)for(var gx=S/2;gx<W;gx+=S){
    if(Math.random()<.3)continue;var x=Math.min(W-1,gx+rnd(-3.5,3.5)),y=Math.min(H-1,gy+rnd(-3.5,3.5));
    var i=((y|0)*W+(x|0))*4;if(d[i+3]<140)continue;
    var r=d[i],g=d[i+1],b=d[i+2],l=r*.3+g*.59+b*.11,col;
    if(l>150)col='rgb('+(r*.5|0)+','+(g*.32|0)+','+(b*.4|0)+')';
    else col='rgb('+Math.min(255,r+95)+','+Math.min(255,g+70)+','+Math.min(255,b+75)+')';
    var ang=rnd(0,6.28),dist=rnd(150,420);
    P.push({x:x,y:y,sx:300+Math.cos(ang)*dist,sy:350+Math.sin(ang)*dist*.9,d:(1-y/H)*1.2+rnd(0,1),c:col,ch:Math.random()<.5?'1':'0',ph:rnd(0,6),f:'bold '+[7,8.5,10][Math.random()*3|0]+'px monospace'});
  }
  for(var j=0;j<46;j++)AM.push({x:rnd(0,W),y:rnd(0,H),v:rnd(10,30),ch:j%2?'1':'0',a:rnd(0,6),s:rnd(9,15)});
  for(j=0;j<34;j++)SP.push({x:rnd(20,W-20),y:rnd(10,H-60),a:rnd(0,6),s:rnd(3,7),f:rnd(1.5,3.5)});
  built=true;
}
function star(x,y,s,a){ctx.globalAlpha=a;ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill()}
function draw(t){
  lastT=t;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
  var sa=Math.max(0,Math.min(1,(t-2.4)/2));
  ctx.globalAlpha=sa;ctx.drawImage(sc,0,0);
  ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=0;i<P.length;i++){
    var p=P[i],u=Math.max(0,Math.min(1,(t-p.d)/1.9));if(u<=0)continue;
    var e=1-Math.pow(1-u,3),x=p.sx+(p.x-p.sx)*e+Math.sin(t*3+p.ph)*(1-e)*14,y=p.sy+(p.y-p.sy)*e+Math.cos(t*2.4+p.ph)*(1-e)*14;
    if(u>=1&&!RM&&Math.random()<.0015)p.ch=p.ch==='0'?'1':'0';
    ctx.globalAlpha=e*(1-.58*sa);ctx.font=p.f;ctx.fillStyle=p.c;ctx.fillText(p.ch,x,y);
  }
  ctx.fillStyle='#e0607a';
  for(i=0;i<AM.length;i++){
    var m=AM[i],yy=((m.y-m.v*t)%H+H)%H;
    ctx.globalAlpha=(.25+.25*Math.sin(t*1.5+m.a))*Math.min(1,t/1.5);ctx.font='bold '+m.s+'px monospace';ctx.fillText(m.ch,m.x+Math.sin(t+m.a)*8,yy);
  }
  if(t>1.5)for(i=0;i<SP.length;i++){var q=SP[i];star(q.x,q.y,q.s,Math.max(0,Math.sin(t*q.f+q.a))*.9)}
  ctx.globalAlpha=1;
}
function frame(now){if(!on)return;draw((now-t0)/1000);requestAnimationFrame(frame)}
var io=new IntersectionObserver(function(es){
  if(RM||!built)return;
  var vis=es[0].isIntersecting;
  if(vis&&!on){on=true;requestAnimationFrame(frame)}else if(!vis)on=false;
});

/* ---------- Interactions ---------- */
$('go').addEventListener('click',function(){
  var h=$('hero');h.classList.add('out');
  setTimeout(function(){
    h.style.display='none';
    ['stage','msg','fin'].forEach(function(i){$(i).classList.remove('locked')});
    window.scrollTo(0,0);fit();build();t0=performance.now();
    if(RM){draw(99)}else{io.observe($('stage'));on=true;requestAnimationFrame(frame)}
    var ro=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}})},{threshold:.35});
    document.querySelectorAll('.rv').forEach(function(n){ro.observe(n)});
  },RM?0:650);
});
$('more').addEventListener('click',function(){$('msg').scrollIntoView({behavior:RM?'auto':'smooth'})});
$('down').addEventListener('click',function(){$('fin').scrollIntoView({behavior:RM?'auto':'smooth'})});
window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
